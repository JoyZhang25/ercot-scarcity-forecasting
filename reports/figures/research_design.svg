<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">ERCOT price-spike prediction clock and locked-test results</title>
  <desc id="desc">Weather vintages, lagged prices, and calendar variables available by 9 AM Central on the previous day are used to rank the next day's hours. The locked 2025 test evaluates forecast ranking separately from the real-time minus day-ahead pricing hypothesis.</desc>
  <defs>
    <marker id="timeline-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#8997A5"/>
    </marker>
  </defs>

  <rect width="1000" height="300" fill="#F7F8FA"/>

  <!-- Header -->
  <text x="52" y="34" fill="#D2642A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">DECISION CLOCK</text>
  <text x="948" y="34" text-anchor="end" fill="#617283" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.8">TARGET · HB_NORTH RT &gt; $100/MWh</text>

  <!-- What enters the forecast -->
  <text x="52" y="68" fill="#183044" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="650">Available to the model</text>
  <text x="52" y="89" fill="#617283" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14">48h weather vintages · lagged prices · calendar</text>

  <text x="400" y="68" fill="#183044" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="650">Rank the next day's 24 hours</text>
  <text x="400" y="89" fill="#617283" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic">pₕ = Pr(RTₕ &gt; $100/MWh)</text>

  <!-- Timeline -->
  <line x1="52" y1="116" x2="944" y2="116" stroke="#8997A5" stroke-width="1.5" marker-end="url(#timeline-arrow)"/>
  <line x1="52" y1="110" x2="52" y2="122" stroke="#8997A5" stroke-width="1.5"/>
  <line x1="338" y1="96" x2="338" y2="125" stroke="#D2642A" stroke-width="2.5"/>
  <circle cx="338" cy="116" r="4.5" fill="#D2642A"/>
  <line x1="567" y1="110" x2="567" y2="122" stroke="#8997A5" stroke-width="1.5"/>
  <line x1="858" y1="110" x2="858" y2="122" stroke="#8997A5" stroke-width="1.5"/>

  <text x="52" y="145" fill="#617283" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13">D−2</text>
  <text x="338" y="145" text-anchor="middle" fill="#B35328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700">09:00 CT · D−1</text>
  <text x="567" y="145" text-anchor="middle" fill="#617283" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13">DAY-AHEAD AUCTION</text>
  <text x="858" y="145" text-anchor="middle" fill="#183044" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700">OPERATING DAY D</text>

  <!-- Two separate locked-test questions -->
  <line x1="500" y1="174" x2="500" y2="243" stroke="#D7DDE3"/>

  <text x="52" y="187" fill="#617283" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.1">LOCKED 2025 · FORECAST TEST</text>
  <text x="52" y="224" fill="#183044" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="650">0.095</text>
  <text x="158" y="224" fill="#183044" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="650">PR-AUC</text>
  <text x="52" y="246" fill="#617283" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14">3.5× the random-ranking baseline</text>

  <text x="548" y="187" fill="#617283" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.1">LOCKED 2025 · PRICING TEST</text>
  <text x="548" y="224" fill="#183044" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="650">−$4.14</text>
  <text x="676" y="224" fill="#183044" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="650">/MWh RT−DA lift</text>
  <text x="548" y="246" fill="#A24F2B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14">No virtual-load alpha in the locked test.</text>

  <!-- Protocol -->
  <line x1="52" y1="266" x2="948" y2="266" stroke="#D7DDE3"/>
  <text x="52" y="287" fill="#617283" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="650" letter-spacing="0.4">FIT 2021–23   ·   SELECT + CALIBRATE 2024   ·   TEST ONCE 2025</text>
  <text x="948" y="287" text-anchor="end" fill="#617283" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic">forecasting skill ≠ trading alpha</text>
</svg>
