<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Point-in-time ERCOT scarcity forecasting research design</title>
  <desc id="desc">Information available at 9 AM the previous day flows through leakage controls and multiple machine learning models into a locked 2025 test, with operational and economic outcomes evaluated separately.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F33"/><stop offset="1" stop-color="#163A5F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#071522" flood-opacity=".32"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#78C6FF"/>
    </marker>
  </defs>
  <rect width="1200" height="430" rx="22" fill="url(#bg)"/>
  <text x="54" y="54" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="25" font-weight="700">Forecast the spike before the auction—not after the weather arrives</text>
  <text x="54" y="82" fill="#A9C7E3" font-family="Arial, sans-serif" font-size="14">Decision clock: 09:00 CT on D−1  ·  Target: HB_NORTH hourly RT price &gt; $100/MWh on D</text>

  <g filter="url(#shadow)">
    <rect x="54" y="120" width="250" height="210" rx="16" fill="#FFFFFF"/>
    <text x="78" y="153" fill="#102A43" font-family="Arial, sans-serif" font-size="17" font-weight="700">PUBLIC INFORMATION SET</text>
    <circle cx="86" cy="192" r="6" fill="#2F80ED"/><text x="104" y="198" fill="#334E68" font-family="Arial, sans-serif" font-size="15">48h-ahead GFS forecasts</text>
    <text x="104" y="219" fill="#829AB1" font-family="Arial, sans-serif" font-size="12">five Texas demand centers</text>
    <circle cx="86" cy="252" r="6" fill="#2F80ED"/><text x="104" y="258" fill="#334E68" font-family="Arial, sans-serif" font-size="15">Lagged grid + price state</text>
    <text x="104" y="279" fill="#829AB1" font-family="Arial, sans-serif" font-size="12">48h minimum latency guardrail</text>
    <circle cx="86" cy="312" r="6" fill="#2F80ED"/><text x="104" y="318" fill="#334E68" font-family="Arial, sans-serif" font-size="15">Calendar structure</text>
  </g>

  <path d="M318 225 H380" stroke="#78C6FF" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="394" y="120" width="250" height="210" rx="16" fill="#FFFFFF"/>
    <text x="418" y="153" fill="#102A43" font-family="Arial, sans-serif" font-size="17" font-weight="700">CONTROLLED MODEL FAMILY</text>
    <text x="418" y="192" fill="#334E68" font-family="Arial, sans-serif" font-size="14">Logistic regression  ·  RBF SVM</text>
    <text x="418" y="224" fill="#334E68" font-family="Arial, sans-serif" font-size="14">Random forest  ·  Gradient boost</text>
    <text x="418" y="256" fill="#334E68" font-family="Arial, sans-serif" font-size="14">Neural network  ·  Seasonal prior</text>
    <rect x="418" y="280" width="202" height="30" rx="15" fill="#EAF2F8"/>
    <text x="519" y="300" text-anchor="middle" fill="#2F80ED" font-family="Arial, sans-serif" font-size="12" font-weight="700">SELECT + CALIBRATE ON 2024</text>
  </g>

  <path d="M658 225 H720" stroke="#78C6FF" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="734" y="120" width="412" height="210" rx="16" fill="#FFFFFF"/>
    <text x="758" y="153" fill="#102A43" font-family="Arial, sans-serif" font-size="17" font-weight="700">LOCKED 2025 TEST</text>
    <rect x="758" y="177" width="164" height="122" rx="12" fill="#EDF7FF"/>
    <text x="840" y="207" text-anchor="middle" fill="#2F80ED" font-family="Arial, sans-serif" font-size="13" font-weight="700">TAIL-RISK SKILL</text>
    <text x="840" y="242" text-anchor="middle" fill="#102A43" font-family="Arial, sans-serif" font-size="25" font-weight="700">3.5×</text>
    <text x="840" y="267" text-anchor="middle" fill="#486581" font-family="Arial, sans-serif" font-size="12">PR-AUC / event rate</text>
    <rect x="946" y="177" width="176" height="122" rx="12" fill="#FFF4E8"/>
    <text x="1034" y="207" text-anchor="middle" fill="#D46B08" font-family="Arial, sans-serif" font-size="13" font-weight="700">ALPHA CHECK</text>
    <text x="1034" y="242" text-anchor="middle" fill="#102A43" font-family="Arial, sans-serif" font-size="25" font-weight="700">Negative</text>
    <text x="1034" y="267" text-anchor="middle" fill="#486581" font-family="Arial, sans-serif" font-size="12">virtual-load spread lift &lt; 0</text>
  </g>

  <rect x="54" y="365" width="1092" height="38" rx="19" fill="#0A1727" opacity=".72"/>
  <text x="600" y="390" text-anchor="middle" fill="#C9E7FF" font-family="Arial, sans-serif" font-size="14">Chronological split  ·  train-only transforms  ·  rare-event metrics  ·  isotonic calibration  ·  daily block bootstrap</text>
</svg>
