[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ercot-scarcity-forecasting"
version = "0.2.0"
description = "Point-in-time machine learning for next-day ERCOT real-time price spikes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jingyi (Joy) Zhang" }]
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "python-calamine>=0.2",
  "requests>=2.31",
  "scikit-learn>=1.3",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["jupyter>=1.0", "nbconvert>=7.0", "pytest>=8.0"]

[project.scripts]
ercot-spike-benchmark = "ercot_spikes.experiment:main"
ercot-alpha-research = "ercot_spikes.alpha_experiment:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
